<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Malcom Catch</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, #201143 0%, #08021a 48%, #03000c 100%);
      font-family: "Courier New", monospace;
    }
    body {
      display: grid;
      place-items: center;
      color: #fff;
    }
    .game-wrap {
      position: relative;
      width: min(100vw, 768px);
      height: min(100vh, 1024px);
      aspect-ratio: 3 / 4;
      max-width: calc(100vh * 0.75);
      max-height: calc(100vw * 1.333);
      filter: drop-shadow(0 0 22px rgba(110, 255, 80, .18));
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 4px solid #6a356f;
      border-radius: 26px;
      background: #070018;
      image-rendering: pixelated;
      cursor: none;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3, 0, 14, .62);
      border-radius: 26px;
      backdrop-filter: blur(2px);
      z-index: 5;
    }
    .panel {
      width: min(88%, 560px);
      border: 5px solid #7bf135;
      background: linear-gradient(180deg, #12072d 0%, #080018 100%);
      box-shadow:
        0 0 0 5px #24103c,
        0 16px 0 rgba(0, 0, 0, .36),
        0 0 30px rgba(123, 241, 53, .28);
      padding: 30px 24px;
      text-align: center;
      border-radius: 18px;
    }
    .title {
      margin: 0 0 16px;
      font-size: clamp(42px, 8vw, 72px);
      line-height: .88;
      letter-spacing: -2px;
      color: #d7ff3f;
      text-shadow:
        4px 4px 0 #116118,
        8px 8px 0 #3e1b6a,
        0 0 18px rgba(216, 255, 63, .34);
    }
    .title span {
      color: #ffb02f;
      text-shadow:
        4px 4px 0 #993100,
        8px 8px 0 #3e1b6a,
        0 0 18px rgba(255, 176, 47, .34);
    }
    .desc {
      margin: 14px auto 24px;
      max-width: 420px;
      font-size: clamp(13px, 2.4vw, 18px);
      line-height: 1.55;
      color: #dbefff;
    }
    .pixel-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 16px 28px;
      background: #ffbc2e;
      color: #170006;
      font: 900 clamp(20px, 4vw, 30px) "Courier New", monospace;
      letter-spacing: 1px;
      box-shadow:
        inset 0 -6px 0 #c64d05,
        inset 0 5px 0 #fff27d,
        0 7px 0 #4b1d00,
        0 0 18px rgba(255,188,46,.35);
      border-radius: 10px;
    }
    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow:
        inset 0 -4px 0 #c64d05,
        inset 0 4px 0 #fff27d,
        0 3px 0 #4b1d00;
    }
    .hidden { display: none; }
    .small {
      margin-top: 18px;
      font-size: 12px;
      color: #92b8ff;
    }
    #endScreen .scoreText {
      margin: 12px 0 24px;
      font-size: clamp(34px, 7vw, 58px);
      color: #fff;
      text-shadow: 4px 4px 0 #3342a7;
    }
    .asset {
      display: none;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" width="768" height="1024" aria-label="Malcom Catch game"></canvas>

    <section id="startScreen" class="screen">
      <div class="panel">
        <h1 class="title">MALCOM<br><span>CATCH</span></h1>
        <p class="desc">
          위에서 떨어지는 말콤 제품을 바구니로 받아보세요!<br>
          놓치면 LIFE -1, 제한 시간은 30초입니다.
        </p>
        <button id="startBtn" class="pixel-btn">START</button>
        <div class="small">마우스 / 손가락 터치로 바구니 이동</div>
      </div>
    </section>

    <section id="endScreen" class="screen hidden">
      <div class="panel">
        <h2 class="title" style="font-size:clamp(32px,7vw,56px);">GAME<br><span>OVER</span></h2>
        <div class="scoreText">SCORE 0</div>
        <button id="retryBtn" class="pixel-btn">RETRY</button>
      </div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");
    const startBtn = document.getElementById("startBtn");
    const retryBtn = document.getElementById("retryBtn");
    const scoreText = document.querySelector("#endScreen .scoreText");
    const ASSETS = [document.getElementById("foamImg"), document.getElementById("oilImg")];

    const W = canvas.width;
    const H = canvas.height;
    const GAME_TIME = 30;

    let state = "start";
    let score = 0;
    let lives = 3;
    let timeLeft = GAME_TIME;
    let startTime = 0;
    let lastTime = 0;
    let spawnTimer = 0;
    let items = [];
    let particles = [];
    let clouds = [];

    const basket = {
      x: W / 2 - 96,
      y: H - 178,
      w: 192,
      h: 104,
      targetX: W / 2 - 96,
      speed: 680
    };

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function resetGame() {
      score = 0;
      lives = 3;
      timeLeft = GAME_TIME;
      startTime = performance.now();
      lastTime = startTime;
      spawnTimer = 0;
      items = [];
      particles = [];
      basket.x = W / 2 - basket.w / 2;
      basket.targetX = basket.x;
      state = "playing";
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
    }

    function endGame() {
      if (state !== "playing") return;
      state = "end";
      scoreText.textContent = `SCORE ${score}`;
      endScreen.classList.remove("hidden");
    }

    function getPointerX(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      return (clientX - rect.left) * (W / rect.width);
    }

    function moveBasketTo(pointerX) {
      basket.targetX = clamp(pointerX - basket.w / 2, 28, W - basket.w - 28);
    }

    canvas.addEventListener("pointermove", (evt) => {
      if (state === "playing") moveBasketTo(getPointerX(evt));
    });
    canvas.addEventListener("pointerdown", (evt) => {
      if (state === "playing") moveBasketTo(getPointerX(evt));
    });
    canvas.addEventListener("touchmove", (evt) => {
      evt.preventDefault();
      if (state === "playing") moveBasketTo(getPointerX(evt));
    }, { passive: false });

    window.addEventListener("keydown", (evt) => {
      if (state !== "playing") return;
      if (evt.key === "ArrowLeft") basket.targetX -= 46;
      if (evt.key === "ArrowRight") basket.targetX += 46;
      basket.targetX = clamp(basket.targetX, 28, W - basket.w - 28);
    });

    startBtn.addEventListener("click", resetGame);
    retryBtn.addEventListener("click", resetGame);

    function makeClouds() {
      clouds = [];
      for (let i = 0; i < 40; i++) {
        clouds.push({
          x: rand(0, W),
          y: rand(180, H - 280),
          s: rand(1, 3),
          a: rand(.25, .8)
        });
      }
    }
    makeClouds();

    function spawnItem() {
      const img = ASSETS[Math.floor(Math.random() * ASSETS.length)];
      const elapsed = GAME_TIME - timeLeft;
      const height = rand(108, 152);
      const ratio = img.naturalWidth / img.naturalHeight || .42;
      const width = height * ratio;
      items.push({
        img,
        x: rand(52, W - width - 52),
        y: -height - rand(0, 80),
        w: width,
        h: height,
        speed: rand(190, 285) + elapsed * 8.5,
        rot: rand(-0.36, 0.36),
        rotSpeed: rand(-0.9, 0.9),
        caught: false
      });
    }

    function addScorePop(x, y, text, good = true) {
      particles.push({ type: "text", text, x, y, vx: rand(-20, 20), vy: -88, life: .7, good });
      for (let i = 0; i < 16; i++) {
        particles.push({
          type: "spark",
          x,
          y,
          vx: rand(-145, 145),
          vy: rand(-190, -40),
          life: rand(.35, .75),
          size: rand(4, 9),
          good
        });
      }
    }

    function update(dt, now) {
      if (state !== "playing") return;

      timeLeft = Math.max(0, GAME_TIME - (now - startTime) / 1000);
      if (timeLeft <= 0) return endGame();

      const direction = basket.targetX - basket.x;
      const step = basket.speed * dt;
      basket.x += Math.abs(direction) <= step ? direction : Math.sign(direction) * step;
      basket.x = clamp(basket.x, 28, W - basket.w - 28);

      spawnTimer -= dt;
      const interval = Math.max(.38, .72 - (GAME_TIME - timeLeft) * .008);
      if (spawnTimer <= 0 && items.length < 7) {
        spawnItem();
        spawnTimer = interval;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed * dt;
        item.rot += item.rotSpeed * dt;

        const itemLeft = item.x + item.w * .18;
        const itemRight = item.x + item.w * .82;
        const itemBottom = item.y + item.h * .88;

        const basketLeft = basket.x + 16;
        const basketRight = basket.x + basket.w - 16;
        const basketTop = basket.y + 15;
        const basketBottom = basket.y + basket.h - 10;

        if (
          itemBottom >= basketTop &&
          item.y + item.h * .22 <= basketBottom &&
          itemRight >= basketLeft &&
          itemLeft <= basketRight
        ) {
          score += 1;
          addScorePop(item.x + item.w / 2, basket.y + 8, "+1", true);
          items.splice(i, 1);
          continue;
        }

        if (item.y > H + 40) {
          lives -= 1;
          addScorePop(clamp(item.x + item.w / 2, 70, W - 70), H - 180, "-1 LIFE", false);
          items.splice(i, 1);
          if (lives <= 0) endGame();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.type === "spark") p.vy += 310 * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function pxRect(x, y, w, h, fill) {
      ctx.fillStyle = fill;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function drawBackground(t) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "#050012");
      grad.addColorStop(.42, "#0c0a33");
      grad.addColorStop(.76, "#180b3e");
      grad.addColorStop(1, "#04000e");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(120, 236, 255, .11)";
      clouds.forEach((s, idx) => {
        const twinkle = .6 + Math.sin(t * .002 + idx) * .4;
        pxRect(s.x, s.y, s.s * 2, s.s * 2, `rgba(165,255,120,${s.a * twinkle})`);
        if (idx % 3 === 0) {
          pxRect(s.x - s.s * 2, s.y, s.s, s.s, `rgba(255,255,255,${s.a * .6 * twinkle})`);
          pxRect(s.x + s.s * 3, s.y, s.s, s.s, `rgba(255,180,62,${s.a * .65 * twinkle})`);
        }
      });

      // City skyline
      ctx.fillStyle = "#070018";
      ctx.fillRect(0, H - 215, W, 215);
      for (let x = 0; x < W; x += 42) {
        const h = 70 + ((x * 19) % 110);
        pxRect(x, H - 215 - h, 32, h, "#11042a");
        if (x % 84 === 0) pxRect(x + 14, H - 230 - h, 4, 16, "#7e33e4");
        for (let wy = H - 202 - h; wy < H - 230; wy += 22) {
          if ((wy + x) % 3 === 0) pxRect(x + 9, wy, 5, 5, "#ffae37");
          if ((wy + x) % 5 === 0) pxRect(x + 22, wy + 6, 5, 5, "#e64492");
        }
      }

      // Bottom floor lines
      for (let y = H - 105; y < H - 38; y += 16) {
        ctx.fillStyle = "rgba(111, 61, 167, .24)";
        ctx.fillRect(56, y, W - 112, 3);
      }
    }

    function drawHUD() {
      pxRect(0, 0, W, 126, "rgba(5,0,18,.9)");
      pxRect(28, 118, W - 56, 4, "#2c266e");

      ctx.textAlign = "left";
      ctx.font = "bold 32px Courier New";
      ctx.fillStyle = "#ffd43a";
      ctx.fillText("SCORE", 74, 52);
      ctx.font = "bold 36px Courier New";
      ctx.fillStyle = "#fff";
      ctx.fillText(String(score).padStart(6, "0"), 58, 100);

      ctx.textAlign = "center";
      ctx.font = "bold 32px Courier New";
      ctx.fillStyle = "#66c8ff";
      ctx.fillText("TIME", W / 2, 52);
      ctx.font = "bold 54px Courier New";
      ctx.fillStyle = timeLeft < 8 ? "#ff5b67" : "#fff";
      ctx.fillText(Math.ceil(timeLeft), W / 2, 102);

      ctx.textAlign = "left";
      ctx.font = "bold 32px Courier New";
      ctx.fillStyle = "#ff6e98";
      ctx.fillText("LIFE", 580, 52);
      ctx.font = "bold 38px Courier New";
      let hearts = "";
      for (let i = 0; i < 3; i++) hearts += i < lives ? "♥ " : "♡ ";
      ctx.fillStyle = "#ff3c62";
      ctx.fillText(hearts, 562, 98);
    }

    function drawBasket() {
      const x = basket.x;
      const y = basket.y;
      const w = basket.w;
      const h = basket.h;

      // handles
      ctx.lineWidth = 18;
      ctx.strokeStyle = "#1a9f2c";
      ctx.lineCap = "square";
      ctx.beginPath();
      ctx.moveTo(x + 18, y + 10);
      ctx.lineTo(x - 10, y - 28);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w - 18, y + 10);
      ctx.lineTo(x + w + 10, y - 28);
      ctx.stroke();

      ctx.lineWidth = 7;
      ctx.strokeStyle = "#9eff3c";
      ctx.beginPath();
      ctx.moveTo(x + 16, y + 10);
      ctx.lineTo(x - 9, y - 25);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w - 16, y + 10);
      ctx.lineTo(x + w + 9, y - 25);
      ctx.stroke();

      // basket body
      pxRect(x, y, w, h, "#82dd35");
      pxRect(x + 8, y + 12, w - 16, h - 22, "#65bf24");
      pxRect(x + 14, y + 18, w - 28, h - 34, "#a6ff47");
      pxRect(x, y, w, 18, "#3da523");
      pxRect(x + 10, y + h - 17, w - 20, 17, "#266b1e");

      // holes
      for (let cx = x + 28; cx < x + w - 20; cx += 30) {
        for (let cy = y + 38; cy < y + h - 26; cy += 25) {
          pxRect(cx, cy, 12, 14, "#245f20");
        }
      }

      // face
      pxRect(x + 68, y + 47, 15, 18, "#101016");
      pxRect(x + 112, y + 47, 15, 18, "#101016");
      pxRect(x + 73, y + 50, 5, 5, "#fff");
      pxRect(x + 117, y + 50, 5, 5, "#fff");
      pxRect(x + 92, y + 70, 20, 7, "#2b1130");
      pxRect(x + 99, y + 76, 11, 7, "#ff6b90");
    }

    function drawItems() {
      items.forEach(item => {
        ctx.save();
        ctx.translate(item.x + item.w / 2, item.y + item.h / 2);
        ctx.rotate(item.rot);
        ctx.shadowColor = "rgba(148,255,56,.7)";
        ctx.shadowBlur = 14;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(item.img, -item.w / 2, -item.h / 2, item.w, item.h);
        ctx.restore();

        // falling trail
        ctx.globalAlpha = .35;
        ctx.fillStyle = "#a8ff3c";
        for (let i = 0; i < 4; i++) {
          pxRect(item.x + item.w * .5 - 2, item.y - 20 - i * 16, 4, 9, "#a8ff3c");
        }
        ctx.globalAlpha = 1;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        const alpha = Math.max(0, Math.min(1, p.life / .7));
        ctx.globalAlpha = alpha;
        if (p.type === "text") {
          ctx.textAlign = "center";
          ctx.font = "bold 34px Courier New";
          ctx.fillStyle = p.good ? "#ffd84d" : "#ff5071";
          ctx.fillText(p.text, p.x, p.y);
        } else {
          ctx.fillStyle = p.good ? "#ffe34d" : "#ff4775";
          pxRect(p.x, p.y, p.size, p.size, ctx.fillStyle);
        }
        ctx.globalAlpha = 1;
      });
    }

    function drawStartIdle(t) {
      ctx.save();
      ctx.globalAlpha = .33;
      ctx.textAlign = "center";
      ctx.font = "bold 84px Courier New";
      ctx.fillStyle = "#d8ff3d";
      ctx.fillText("MALCOM", W / 2, 260 + Math.sin(t * .002) * 8);
      ctx.fillStyle = "#ffad2e";
      ctx.fillText("CATCH", W / 2, 340 + Math.sin(t * .002) * 8);
      ctx.restore();
      drawBasket();
    }

    function drawFrame(t) {
      ctx.imageSmoothingEnabled = false;
      drawBackground(t);
      if (state === "playing") {
        drawItems();
        drawBasket();
        drawParticles();
        drawHUD();
      } else {
        drawStartIdle(t);
        drawHUD();
      }
    }

    function loop(now) {
      const dt = Math.min(.035, (now - lastTime) / 1000 || 0);
      lastTime = now;
      update(dt, now);
      drawFrame(now);
      requestAnimationFrame(loop);
    }

    function waitImages() {
      return Promise.all(ASSETS.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));
    }

    waitImages().then(() => {
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
